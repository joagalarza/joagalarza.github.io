<template id="about"><section class="intro wrap"><h1><strong>Joaquin Galarza</strong></h1><div class="bio-grid"><div class="bio"><p>I am a Statistics undergraduate at Universidad Nacional Mayor de San Marcos in Lima, Peru. My academic interests include ecological and spatial statistics, public health, and data science education.</p><p>Previously, I worked as a research assistant in the Space Physics Laboratory at <a href="https://www.intinauta.com/" target="_blank" rel="noopener noreferrer">Intinauta Research Center</a>. My work focused on informal urban expansion and flood-related environmental risk in Belén, Iquitos, combining satellite imagery, geospatial analysis, and statistical tools. I worked under the mentorship of <a href="https://scholar.google.com/citations?user=1CZ-aLwAAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer">Cristian Ferradas</a> and the supervision of <a href="https://www.linkedin.com/in/roberto-future/" target="_blank" rel="noopener noreferrer">Roberto Future</a>.</p><p>Beyond research, I build spaces for people to learn together. Through initiatives such as <a href="#leadership">Datea+</a> and the <a href="#leadership">Young Data Scientists Camp</a>, I work to make learning and opportunities in data science more accessible.</p><div class="bio-actions"><a class="pill solid" href="https://docs.google.com/document/d/1G5TSKPhGNQC2DrxG7YPiYL1vISMm9-s1/edit?usp=sharing&amp;ouid=113040643728336825978&amp;rtpof=true&amp;sd=true" target="_blank" rel="noopener noreferrer" aria-label="View CV (opens in a new tab)">VIEW CV</a></div></div><aside class="profile"><img class="portrait" src="joaquin.jpg" alt="Joaquin Galarza smiling" width="880" height="1195"><p class="photo-caption">Lima, Peru</p></aside></div></section><section class="wrap updates" aria-labelledby="news-heading"><h2 id="news-heading">News</h2><dl class="news-list"><div class="news-row"><dt><time datetime="2026-09">Sep 2026</time></dt><dd>I was selected for <strong>ecoREPU 2027</strong> for a research internship at <strong>Lund University</strong> with <a href="https://portal.research.lu.se/en/persons/yohan-sassi/" target="_blank" rel="noopener noreferrer">Yohan Sassi</a> and <a href="https://portal.research.lu.se/en/persons/cecilia-nilsson/" target="_blank" rel="noopener noreferrer">Cecilia Nilsson</a>, focusing on bird movement and migration. Their research uses weather radar data to understand flight patterns and inform bird conservation.</dd></div><div class="news-row"><dt><time datetime="2026-08">Aug 2026</time></dt><dd>I attended <a href="https://www.ieee-ras.org/event/2026-ieee-22nd-international-conference-on-automation-science-and-engineering-case-69030/" target="_blank" rel="noopener noreferrer">IEEE CASE 2026</a> in <strong>Shenyang, China</strong>, supported by the <strong>IEEE RAS IDEA Travel Grant</strong>, which helps students from underrepresented backgrounds access international conferences.</dd></div></dl><h2 id="honors-heading">Honors &amp; Awards</h2><div class="honor-row"><div class="honor-period">2024-II &amp; 2025-II</div><div><h3>Academic Excellence Award</h3><p class="honor-institution">Faculty of Mathematical Sciences, UNMSM</p><p>Recognized for outstanding academic performance during the 2024-II and 2025-II semesters, ranking first in my cohort in the Statistics program.</p></div></div></section><section class="highlights"><div class="wrap cards"><article class="card"><span class="card-number">01 / EXPLORE</span><h2>Research &amp; Projects</h2><p>Questions about our environment, explored through statistics and geospatial data.</p><a class="pill" href="#projects">EXPLORE PROJECTS</a></article><article class="card"><span class="card-number">02 / SHARE</span><h2>Talks &amp; Presentations</h2><p>Research posters, academic presentations, and ideas shared along the way.</p><a class="pill" href="#talks">VIEW TALKS</a></article><article class="card"><span class="card-number">03 / CONNECT</span><h2>Leadership &amp; Community</h2><p>Creating opportunities to learn, collaborate, and find a place in data science.</p><a class="pill" href="#leadership">DISCOVER</a></article></div></section></template>
<template id="projects"><section class="wrap page"><p class="eyebrow">RESEARCH &amp; EXPLORATION</p><h1>Projects<span>.</span></h1><p class="lede">Applying statistical thinking to environmental and social questions.</p><div class="project-list"><article class="project"><div class="project-meta">01 / GEOSPATIAL DATA<p>Peruvian Amazon</p></div><div><h2>Urban Informal Development and Environmental Risk in Iquitos, Peru</h2><p>Exploring urban change in Belén and its relationship with flood exposure, combining satellite imagery, geospatial analysis, and community validation.</p><p class="muted">Mentorship: Cristian Ferradas. Supervision: Roberto Future.</p><div class="tags"><span>R</span><span>QGIS</span><span>Sentinel imagery</span></div></div></article><article class="project"><div class="project-meta">02 / MACHINE LEARNING</div><div><h2>On the Robustness of SHAP in Legal NLP</h2><p>Exploring the stability of model explanations under adversarial perturbations in legal text classification.</p><div class="tags"><span>Explainable AI</span><span>NLP</span><span>SHAP</span></div></div></article><article class="project"><div class="project-meta">03 / PUBLIC HEALTH</div><div><h2>Cancer Incidence and Mortality Analysis</h2><p>An exploration of cancer incidence and mortality data in the United States from 2006 to 2016.</p><div class="tags"><span>Health data</span><span>Statistical analysis</span></div></div></article></div></section></template>

<template id="leadership"><section class="wrap page"><p class="eyebrow">BUILDING OPPORTUNITIES TOGETHER</p><h1>Leadership<span>.</span></h1><p class="lede">Making space for more people to learn, connect, and take their first steps in data science.</p><article class="camp-feature"><div class="camp-copy"><span class="eyebrow">FOUNDER &amp; DIRECTOR</span><h2>Young Data Scientists Camp</h2><p>I founded and directed Peru's first data science camp for high school and gap-year students taking their first steps in the field.</p><p class="camp-support">Supported by UTEC and Microsoft Perú, with funding from DataCamp Donates.</p><div class="camp-actions"><div class="metrics"><div><strong>567</strong><span>applications</span></div><div><strong>35</strong><span>selected participants</span></div></div><a class="pill" href="https://www.youngdatascience.org/" target="_blank" rel="noopener noreferrer">VISIT YDS CAMP</a></div></div><figure class="camp-photo"><img src="yds-camp.png" width="975" height="650" alt="Students participating in a Young Data Scientists Camp classroom session" loading="lazy"><figcaption>Young Data Scientists Camp · 2026</figcaption></figure></article><div class="cards two"><article class="card"><span class="eyebrow">FOUNDER &amp; EXECUTIVE DIRECTOR</span><h2>Datea+</h2><p>Opening conversations about science and data, and connecting students with learning opportunities.</p><a class="pill" href="https://www.instagram.com/dateamas/" target="_blank" rel="noopener noreferrer">DATEA+ ON INSTAGRAM</a></article><article class="card"><span class="eyebrow">GENERAL COORDINATOR</span><h2>Artificial Intelligence Club</h2><p class="club-org">Clubes de Ciencia Perú</p><p>I coordinate the Artificial Intelligence Club, helping create a space for students to learn and explore AI together.</p><a class="pill" href="https://www.instagram.com/clubdecienciacomputacion/" target="_blank" rel="noopener noreferrer">EXPLORE THE CLUB</a></article></div><article class="card mentorship-card"><div class="mentorship-copy"><span class="eyebrow">FOUNDER · MENTORSHIP</span><h2>Desde Cero</h2><p>A mentorship program I created for first-generation students, offering guidance on finding opportunities, writing a CV, preparing applications, and discovering learning resources.</p><p><strong>Two cohorts completed. Preparing for our third!</strong></p><a class="pill" href="#blog/desde-cero">READ THE UPDATE</a></div><img class="mentorship-image" src="desde-cero.png" width="1200" height="1200" alt="Desde Cero: free mentorship for first-generation students" loading="lazy"></article></section></template>
<template id="teaching"><section class="wrap page"><p class="eyebrow">LEARNING TOGETHER</p><h1>Teaching<span>.</span></h1><p class="lede">An introduction to thinking with probability and statistics.</p><div class="cards two"><article class="card"><span class="eyebrow">MARCH 2026 · COMPLETED</span><h2>Introduction to Probability</h2><p>I taught Introduction to Probability in March 2026, helping students take their first steps in understanding uncertainty.</p></article><article class="card"><span class="eyebrow">CURRENTLY TEACHING</span><h2>Introduction to Statistics</h2><p>I am currently teaching Introduction to Statistics. I will share course materials and learning resources here.</p></article><article class="card teaching-outreach"><span class="eyebrow">STATISTICAL EDUCATION · SCHOOL OUTREACH</span><h2>Statistics for Kids</h2><p>I taught in several Peruvian public schools, encouraging students to discover statistics and develop an interest in learning with data.</p><div class="teaching-gallery" aria-label="Statistics for Kids classroom activities"><img src="statistics-kids-1.jpg" width="1536" height="1536" alt="Hand-drawn questions and illustrations from a Statistics for Kids activity" loading="lazy"><img src="statistics-kids-2.jpg" width="1536" height="1536" alt="School students creating tables and bar charts during a statistics activity" loading="lazy"><img src="statistics-kids-3.jpg" width="1536" height="1536" alt="School students presenting their data visualizations to the class" loading="lazy"></div></article></div></section></template>

<template id="post-desde-cero"><article class="wrap page post-detail"><a class="back-to-blog" href="#blog">← Back to Blog</a><header class="post-heading"><h1>Desde Cero: Two Cohorts, and a Third on the Way</h1><p class="essay-deck">A mentorship program helping first-generation students find opportunities, prepare a CV, and access learning resources.</p></header><dl class="post-byline"><div><dt>AUTHOR</dt><dd>Joaquin Galarza</dd></div><div><dt>AFFILIATION</dt><dd>Universidad Nacional Mayor de San Marcos</dd></div><div><dt>PUBLISHED</dt><dd><time datetime="2026-09">September 2026</time></dd></div></dl><div class="essay-body"><p>Desde Cero has now had two cohorts, and we are getting ready for the third! I created this mentorship program to support first-generation students as they find opportunities and take their next steps in academic life.</p><p>As a first-generation student myself, I know how much there can be to figure out beyond the classroom. Where do you find opportunities? How do you decide which ones fit your interests? What belongs in a CV when you are still beginning? These are the kinds of questions I want Desde Cero to make easier to ask.</p><h3>Starting with practical support</h3><p>The program brings together guidance on finding opportunities, preparing applications, and writing a CV, alongside learning resources students can return to as they move forward. The aim is to help participants describe what they have already done and identify what they would like to try next.</p><p>A first CV can include more than formal work experience. Coursework, student initiatives, personal projects, and community participation can all help tell the story of a student's interests and contributions. Learning to explain those experiences clearly is an important part of beginning.</p><h3>Two cohorts, and a third on the way</h3><p>Reaching two cohorts means a great deal to me. Desde Cero began with a simple purpose: to offer the kind of guidance that can make an unfamiliar process feel more approachable. I am excited to keep building that space as we prepare for our third cohort.</p><p>I will share more about the next cohort here when the details are ready. For now, I am happy to mark this step and keep working toward what comes next. :)</p><figure class="program-poster"><img src="desde-cero.png" width="1200" height="1200" alt="Desde Cero mentorship program poster" loading="lazy"></figure></div><a class="back-to-blog bottom-back" href="#blog">← All posts</a></article></template>
<template id="post-learning-to-belong"><article class="wrap page post-detail"><a class="back-to-blog" href="#blog">← Back to Blog</a><header class="post-heading"><h1>Learning to Belong While Finding My Way</h1><p class="essay-deck">On adapting to unfamiliar academic spaces as a first-generation student in STEM.</p></header><dl class="post-byline"><div><dt>AUTHOR</dt><dd>Joaquin Galarza</dd></div><div><dt>AFFILIATION</dt><dd>Universidad Nacional Mayor de San Marcos</dd></div><div><dt>PUBLISHED</dt><dd><time datetime="2026-09">September 2026</time></dd></div></dl><div class="essay-body"><p>As a first-generation university student in Peru, I am learning two things at once: statistics, and how to find my way through academic life. One has courses, exercises, and exams. The other appears in less predictable places: an application form, an email to a researcher, a conversation about opportunities I am only beginning to understand. Both require effort, but only one usually appears on a transcript.</p><p>Being the first in my family to attend university gives me a great sense of possibility. It also means that many of the decisions ahead of me are unfamiliar at home. My family can care deeply about my education without knowing how a research internship works or what a future in science might look like. That distinction matters to me. There is support in my life, even when there is no ready-made set of instructions.</p><h3>The things a syllabus cannot explain</h3><p>Academic spaces have a vocabulary that extends beyond the subject being taught. Finding a mentor, describing a research interest, approaching a professor, or understanding the purpose of a conference are all things students have to learn. When those things are already familiar to the people around you, it can be easy to mistake their familiarity for a measure of your own ability.</p><p>I try to remember this when a new environment feels difficult. A question that seems obvious to someone else may be a question I am encountering for the first time. Asking it takes a little courage. Leaving it unanswered, however, makes every next step harder. I want to become more comfortable saying what I understand, what I have tried, and where I need guidance.</p><p>Language adds another layer. I can be excited about an idea and still struggle to express it as naturally in English as I would in Spanish. There is a difference between having something to contribute and being able to say it quickly. I am learning to give myself time for both. Preparing a few questions before a meeting can help; so can remembering that a pause does not erase the thought behind it.</p><h3>Ambition has practical conditions</h3><p>I care about doing well academically, and recognition for my work means a great deal to me. Still, an academic record cannot resolve every uncertainty. An opportunity may come with travel costs, competing schedules, or decisions about how to continue my studies while taking part. These practical questions deserve as much attention as the excitement of being selected.</p><p>For me, adapting means being willing to discuss those conditions honestly. I can be grateful for an opportunity and ask what would make it possible to participate. I can have ambitious goals and need help planning the next step. I am still learning how to hold those things together without treating every obstacle as a judgment about whether I belong.</p><p>I also want to be careful about the stories I tell about perseverance. It is tempting to describe a difficult experience only after it has become an achievement. That leaves out the uncertainty, the people who helped, and the circumstances that made progress possible. When I share an opportunity or an award, I want there to be room for that fuller story.</p><h3>Making the next step easier to find</h3><p>These questions are connected to why I care about data science education and student communities. Through Datea+ and the Young Data Scientists Camp, I want to help create spaces where students can ask early questions without feeling that they should already know the answers. A clear explanation, an accessible learning resource, or a conversation with someone a little further along can make a next step easier to imagine.</p><p>Building these spaces also reminds me that I am still a learner. I do not need to have solved every difficulty before sharing something useful. I can explain what I have learned, acknowledge what I do not know, and keep listening. That feels like a more honest foundation for community than pretending to have a complete plan.</p><p>I am writing this while my path is still taking shape. There are unfamiliar rooms ahead of me, and probably questions I have not yet learned to ask. I hope to enter them with curiosity, prepare as well as I can, and let other people help. As I find my way, I want to leave clearer directions for the students who come next.</p></div><a class="back-to-blog bottom-back" href="#blog">← All posts</a></article></template>
